<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #F5F7FA;
    color: #14213D;
}

.profile-page {
    max-width: 650px;
    margin: 30px auto;
    background: white;
    min-height: 100vh;
}

/* Profile Top */

.profile-top {
    background: #0D47A1;
    color: white;
    text-align: center;
    padding: 30px 20px;
}

.back {
    text-align: left;
    font-size: 28px;
    cursor: pointer;
    margin-bottom: 10px;
}

.profile-photo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #E8F1FF;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    color: #0D47A1;
    border: 4px solid white;
}

.profile-top h1 {
    margin-top: 15px;
    font-size: 25px;
}

.profile-top p {
    margin-top: 6px;
    font-size: 15px;
}

/* Content */

.content {
    padding: 20px;
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0 12px;
    color: #14213D;
}

/* Information Card */

.info-card {
    background: white;
    border: 1px solid #E0E5EC;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.info-row {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 14px 0;
    border-bottom: 1px solid #EEEEEE;
}

.info-row:last-child {
    border-bottom: none;
}

.icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #E8F1FF;
    color: #0D47A1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.info-text {
    flex: 1;
}

.label {
    font-size: 13px;
    color: #777;
    margin-bottom: 6px;
}

/* Input */

.info-text input,
.info-text textarea {
    width: 100%;
    border: none;
    outline: none;
    font-size: 16px;
    color: #14213D;
    background: transparent;
}

.info-text textarea {
    resize: none;
    height: 45px;
}

/* Settings */

.menu-card {
    background: white;
    border: 1px solid #E0E5EC;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 17px;
    border-bottom: 1px solid #EEEEEE;
    cursor: pointer;
}

.menu-item:last-child {
    border-bottom: none;
}

.menu-item:hover {
    background: #E8F1FF;
}

.menu-icon {
    color: #0D47A1;
    font-size: 21px;
    width: 30px;
    text-align: center;
}

.menu-name {
    flex: 1;
    font-size: 16px;
    font-weight: 500;
}

.arrow {
    color: #777;
    font-size: 20px;
}

/* Save Button */

.save-btn {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #0D47A1;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* Logout */

.logout {
    margin-top: 12px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #C62828;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* Mobile */

@media (max-width: 700px) {

    .profile-page {
        margin: 0;
        width: 100%;
    }

    .content {
        padding: 15px;
    }

}

</style>
</head>

<body>

<div class="profile-page">

    <!-- Profile Top -->

    <div class="profile-top">

        <div class="back" onclick="history.back()">‹</div>

        <div class="profile-photo">
            👤
        </div>

        <!-- અહીં browser માં નામ લખી શકો -->
        <h1>
            <input
                type="text"
                placeholder="Enter Your Name"
                style="text-align:center; color:white; font-size:25px; font-weight:bold;">
        </h1>

        <p>My Profile</p>

    </div>


    <div class="content">

        <!-- Personal Information -->

        <div class="section-title">
            Personal Information
        </div>

        <div class="info-card">

            <!-- Name -->

            <div class="info-row">

                <div class="icon">👤</div>

                <div class="info-text">

                    <div class="label">
                        Name
                    </div>

                    <input
                        type="text"
                        placeholder="Enter your name">

                </div>

            </div>


            <!-- Mobile -->

            <div class="info-row">

                <div class="icon">📱</div>

                <div class="info-text">

                    <div class="label">
                        Mobile Number
                    </div>

                    <input
                        type="tel"
                        placeholder="Enter mobile number"
                        maxlength="10">

                </div>

            </div>


            <!-- Email -->

            <div class="info-row">

                <div class="icon">✉️</div>

                <div class="info-text">

                    <div class="label">
                        Email
                    </div>

                    <input
                        type="email"
                        placeholder="Enter your email">

                </div>

            </div>


            <!-- Address -->

            <div class="info-row">

                <div class="icon">📍</div>

                <div class="info-text">

                    <div class="label">
                        Address
                    </div>

                    <textarea
                        placeholder="Enter your address"></textarea>

                </div>

            </div>

        </div>


        <!-- Settings -->

        <div class="section-title">
            Settings
        </div>

        <div class="menu-card">

            <div class="menu-item">

                <div class="menu-icon">✏️</div>

                <div class="menu-name">
                    Edit Profile
                </div>

                <div class="arrow">›</div>

            </div>


            <div class="menu-item">

                <div class="menu-icon">🔒</div>

                <div class="menu-name">
                    Change Password
                </div>

                <div class="arrow">›</div>

            </div>

        </div>


        <!-- Save -->

        <button class="save-btn">
            Save Changes
        </button>


        <!-- Logout -->

        <button class="logout">
            Logout
        </button>

    </div>

</div>

</body>
</html>
